version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    networks:
      - ml-network

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - ml-network

  mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "5001:5001"
    command: >
      sh -c "pip install mlflow && mlflow ui --host 0.0.0.0 --port 5001"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge
